[project]
name = "ai-compiled-towerdefense-backend"
version = "0.1.0"
description = "FastAPI + SQLite backend for the AI-compiled tower defense asset compiler."
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.110",
    "uvicorn>=0.27",
    "pydantic>=2.5",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4",
    "httpx>=0.26",
]

[tool.pytest.ini_options]
testpaths = ["backend/tests"]
pythonpath = ["backend"]
